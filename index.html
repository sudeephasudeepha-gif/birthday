<script>
  function enableAudio() {
    const audio = document.getElementById('birthdayAudio');
    audio.volume = 0.9;

    audio.play()
      .then(() => {
        console.log("🎵 Music started!");
        startInfiniteHearts(); // 👈 continuous hearts start here
        document.querySelector('.btn').style.display = 'none';
        showMusicButton(audio);
      })
      .catch(err => {
        console.log("⚠️ Audio play failed:", err);
        alert("Please click once to enable sound 🎵");
      });
  }

  // ❤️ Create one batch of hearts
  function createHearts() {
    for (let i = 0; i < 10; i++) {
      const heart = document.createElement('div');
      heart.textContent = '💚';
      heart.style.position = 'fixed';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.top = Math.random() * 100 + 'vh';
      heart.style.fontSize = Math.random() * 24 + 16 + 'px';
      heart.style.opacity = 0.8;
      heart.style.animation = `floatHeart ${2 + Math.random() * 4}s ease-in-out infinite`;
      heart.style.zIndex = 999;
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }
  }

  // ♾️ Keep creating hearts forever (every 1 second)
  function startInfiniteHearts() {
    createHearts(); // first batch immediately
    setInterval(createHearts, 1000); // keep spawning new ones
  }

  // ✨ Sparkle effect when clicking the cake
  function sparkleEffect() {
    for (let i = 0; i < 15; i++) {
      const sparkle = document.createElement('div');
      sparkle.textContent = '✨';
      sparkle.style.position = 'fixed';
      sparkle.style.left = (window.innerWidth / 2) + (Math.random() * 100 - 50) + 'px';
      sparkle.style.top = (window.innerHeight / 2) + (Math.random() * 100 - 50) + 'px';
      sparkle.style.opacity = 0.8;
      sparkle.style.fontSize = '20px';
      sparkle.style.animation = 'sparkleFade 1s ease-out';
      sparkle.style.zIndex = 1000;
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 1000);
    }
  }

  // 🎵 Music toggle button
  function showMusicButton(audio) {
    const musicBtn = document.createElement('button');
    musicBtn.innerHTML = '🔊 Pause';
    Object.assign(musicBtn.style, {
      position: 'fixed',
      bottom: '20px',
      right: '20px',
      zIndex: '1000',
      padding: '8px 15px',
      borderRadius: '20px',
      border: 'none',
      cursor: 'pointer',
      backgroundColor: 'rgba(255,255,255,0.3)',
      color: 'white',
      fontFamily: 'Arial, sans-serif'
    });

    musicBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        musicBtn.innerHTML = '🔊 Pause';
      } else {
        audio.pause();
        musicBtn.innerHTML = '🔈 Play';
      }
    });

    document.body.appendChild(musicBtn);
  }

  // 🎂 Sparkles on cake click
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('cake').addEventListener('click', sparkleEffect);
  });
</script>
